services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-manager-client
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - API_UPSTREAM=${API_UPSTREAM:-http://host.docker.internal:9090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
