services:
  client-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: personalops-client-dev
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=${API_PROXY_TARGET:-http://host.docker.internal:9090}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personalops-client-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - API_UPSTREAM=${API_UPSTREAM:-http://host.docker.internal:9090}
    extra_hosts:
      - "host.docker.internal:host-gateway"
