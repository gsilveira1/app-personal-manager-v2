worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # One JSON event per request on stdout. $uri, not $request: sensitive query params never reach logs.
  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream_status":"$upstream_status"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Everything nginx writes goes to /tmp (allows read-only root filesystem).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

  # Rendered from /etc/nginx/templates/default.conf.template at container start.
  include /tmp/default.conf;
}
